name: Artifex
version: 2.3.0
main: me.dcplugin.artifex.Main
api-version: '1.21'
description: Modular custom items plugin with Java API
author: animesao

softdepend:
  - PlaceholderAPI
  - Vault

commands:
  artifex:
    description: Primary Artifex plugin command
    usage: /artifex <reload|save|validate|debug|backup>
    aliases: [af, art, ci, customitems]
    permission: artifex.reload
  saveitem:
    description: Export held item to Artifex YAML configuration
    usage: /saveitem <id> [--force]
    aliases: [ci-save, artifex-save]
    permission: artifex.save

permissions:
  artifex.reload:
    description: Reload plugin
    default: op
  dcustomitems.reload:
    description: Legacy reload permission
    default: op
  artifex.save:
    description: Export held item into plugin configuration
    default: op
  artifex.menu:
    description: Open the interactive item catalog GUI
    default: op
  artifex.update:
    description: Receive update notifications
    default: op
  customitems.update:
    description: Legacy update notification permission
    default: op
