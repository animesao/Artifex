# ============================================
# 🛠 CustomCraft — Мастерская кастомных крафтов
# ============================================
# Модуль: визуальный верстак, выбор станций крафта и
# внутриигровой конструктор кастомных рецептов с поддержкой
# любых кастомных предметов Artifex и других плагинов.
#
# Отключение: удалите папку items/customcraft/ или установите enabled: false.

name: "CustomCraft"
version: "2.1"
enabled: true

# Команды модуля
command: customcraft
commands:
  - customcraft
  - ccraft

# Права
permission: dci.customcraft
admin-permission: dci.customcraft.admin

# Настройки GUI
gui:
  main-title: "&8⚒ &lМастерская Крафта"
  station-chooser-title: "&8⚙ &lВыберите станцию крафта"
  builder-title: "&8✨ &lКонструктор: &e{station}"
  craft-title: "&8⚒ &lВиртуальный верстак"
  catalog-title: "&8📖 &lКаталог рецептов"
  filler: GRAY_STAINED_GLASS_PANE
  result-slot: 15
  return-items-on-close: true

# Сообщения
messages:
  no-permission: "&cУ вас нет прав для использования /customcraft!"
  no-admin-permission: "&cУ вас нет прав для создания кастомных рецептов!"
  recipe-saved: "&a✔ Рецепт для станции &e{station} &aуспешно создан и добавлен на сервер!"
  recipe-error-no-ingredients: "&cОшибка: добавьте хотя бы один ингредиент в сетку!"
  recipe-error-no-result: "&cОшибка: поместите результат крафта в слот результата!"
  recipe-canceled: "&eСоздание рецепта отменено. Все предметы возвращены."
  no-recipes: "&cПока нет доступных кастомных рецептов."
  crafted: "&aПредмет успешно создан!"
  inventory-full: "&cИнвентарь полон, предметы сброшены на землю!"
