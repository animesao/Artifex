name: Build & Release

on:
  push:
    branches: [ main ]
    tags: [ 'v*' ]
  pull_request:
    branches: [ main ]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.version.outputs.version }}
    steps:
    - uses: actions/checkout@v4

    - name: Set up JDK 21
      uses: actions/setup-java@v4
      with:
        java-version: '21'
        distribution: 'temurin'

    - name: Cache Maven packages
      uses: actions/cache@v4
      with:
        path: ~/.m2/repository
        key: ${{ runner.os }}-maven-${{ hashFiles('**/pom.xml') }}
        restore-keys: |
          ${{ runner.os }}-maven-

    - name: Read version from VERSION file
      id: version
      run: |
        VERSION=$(cat VERSION | tr -d '[:space:]')
        echo "version=$VERSION" >> $GITHUB_OUTPUT
        echo "📦 Version from VERSION file: $VERSION"

    - name: Update pom.xml version
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        # Надёжнее, чем sed по первому <version>: versions:set меняет именно project.version
        mvn -q versions:set -DnewVersion="${VERSION}" -DgenerateBackupPoms=false
        echo "✅ pom.xml updated to $VERSION"
        grep -m1 "<version>" pom.xml

    - name: Update plugin.yml version
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        sed -i "s/^version: .*/version: ${VERSION}/" src/main/resources/plugin.yml
        echo "✅ plugin.yml updated to $VERSION"
        grep "version:" src/main/resources/plugin.yml

    - name: Build with Maven
      run: mvn clean package -q

    - name: Upload coverage report (JaCoCo)
      uses: actions/upload-artifact@v4
      with:
        name: jacoco-report-${{ steps.version.outputs.version }}
        path: target/site/jacoco/
        retention-days: 14

    - name: Verify JAR exists
      run: |
        VERSION="${{ steps.version.outputs.version }}"
        JAR="target/Artifex-${VERSION}.jar"
        if [ ! -f "$JAR" ]; then
          echo "❌ JAR not found: $JAR"
          ls -la target/
          exit 1
        fi
        echo "✅ JAR built: $JAR"
        ls -lh "$JAR"

    - name: Upload JAR artifact
      uses: actions/upload-artifact@v4
      with:
        name: Artifex-${{ steps.version.outputs.version }}
        path: target/Artifex-${{ steps.version.outputs.version }}.jar
        retention-days: 7

  release:
    needs: build
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    env:
      VERSION: ${{ needs.build.outputs.version }}
    steps:
    - uses: actions/checkout@v4
      with:
        fetch-depth: 0

    - name: Download JAR
      uses: actions/download-artifact@v4
      with:
        name: Artifex-${{ env.VERSION }}

    - name: Generate release notes
      run: |
        VERSION="${{ env.VERSION }}"
        CHANGELOG=CHANGELOG.md

        # Пытаемся извлечь секцию "## v<VERSION>" из CHANGELOG.md
        if [ -f "$CHANGELOG" ]; then
          awk -v ver="v${VERSION}" '
            index($0, "## " ver) == 1 { found=1; next }
            found && /^## / { exit }
            found { print }
          ' "$CHANGELOG" > changelog-section.txt
        else
          : > changelog-section.txt
        fi

        echo "## 🚀 Artifex v${VERSION}" > notes.md
        echo "" >> notes.md

        if [ -s changelog-section.txt ]; then
          cat changelog-section.txt >> notes.md
        else
          # Фолбэк: git log от предыдущего тега
          PREV_TAG=$(git describe --tags --abbrev=0 HEAD^ 2>/dev/null || echo "")
          if [ -n "$PREV_TAG" ]; then
            echo "### 📝 What's Changed since $PREV_TAG" >> notes.md
            echo "" >> notes.md
            git log --oneline ${PREV_TAG}..HEAD --pretty=format:"- %s" >> notes.md
          else
            echo "### 📝 Initial Release" >> notes.md
            echo "" >> notes.md
            git log --oneline -20 --pretty=format:"- %s" >> notes.md
          fi
        fi

        echo "" >> notes.md
        echo "" >> notes.md
        echo "---" >> notes.md
        echo "" >> notes.md
        echo "### 📦 Installation" >> notes.md
        echo "1. Download \`Artifex-${VERSION}.jar\` from Assets" >> notes.md
        echo "2. Place in your server's \`plugins/\` folder" >> notes.md
        echo "3. Restart the server" >> notes.md
        echo "" >> notes.md
        echo "### 📚 Documentation" >> notes.md
        echo "- [README](https://github.com/animesao/dcustomitems#readme)" >> notes.md
        echo "- [Full Documentation](https://github.com/animesao/dcustomitems/tree/main/docs)" >> notes.md

    - name: Create GitHub Release
      uses: softprops/action-gh-release@v2
      with:
        name: "Artifex v${{ env.VERSION }}"
        body_path: notes.md
        files: Artifex-${{ env.VERSION }}.jar
        draft: false
        prerelease: false
      env:
        GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
